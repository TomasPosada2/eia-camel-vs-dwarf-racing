spring:
  application:
    name: racing-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:racing_db}
    username: ${DB_USERNAME:racing_user}
    password: ${DB_PASSWORD:racing_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-local-development-secret-key-change-it-before-any-real-deployment-0123456789}
    access-token-expiration-ms: ${JWT_EXPIRATION:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  competitors:
    max-team-size: ${MAX_TEAM_SIZE:10}
  cors:
    allowed-origins: ${API_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.eia.racing: INFO
